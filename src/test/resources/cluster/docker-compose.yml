# Six redis:7-alpine nodes (3 masters + 3 replicas) using host networking, plus
# a one-shot bootstrap container that runs `redis-cli --cluster create`.
#
# `network_mode: host` is used so the cluster's announce-ip (127.0.0.1) is
# reachable from both other cluster nodes and the JUnit JVM running on the host.
# This is the simplest known shape for running a real Redis Cluster from
# Testcontainers without proxies or hostname rewrites.
#
# Service names are `redis1..redis6` (no dash) to avoid Testcontainers'
# ComposeDelegate.getServiceInstanceName regex misreading a trailing `-N` as
# the compose instance suffix.
#
# Linux-only. Ports 7001-7006 (data) and 17001-17006 (cluster bus) must be free
# on the host. The test polls `CLUSTER INFO` until `cluster_state:ok` before
# returning.

services:
  redis1:
    image: redis:7-alpine
    network_mode: host
    command:
      - redis-server
      - --port
      - "7001"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /tmp/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - "127.0.0.1"
      - --appendonly
      - "no"
      - --save
      - ""

  redis2:
    image: redis:7-alpine
    network_mode: host
    command:
      - redis-server
      - --port
      - "7002"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /tmp/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - "127.0.0.1"
      - --appendonly
      - "no"
      - --save
      - ""

  redis3:
    image: redis:7-alpine
    network_mode: host
    command:
      - redis-server
      - --port
      - "7003"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /tmp/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - "127.0.0.1"
      - --appendonly
      - "no"
      - --save
      - ""

  redis4:
    image: redis:7-alpine
    network_mode: host
    command:
      - redis-server
      - --port
      - "7004"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /tmp/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - "127.0.0.1"
      - --appendonly
      - "no"
      - --save
      - ""

  redis5:
    image: redis:7-alpine
    network_mode: host
    command:
      - redis-server
      - --port
      - "7005"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /tmp/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - "127.0.0.1"
      - --appendonly
      - "no"
      - --save
      - ""

  redis6:
    image: redis:7-alpine
    network_mode: host
    command:
      - redis-server
      - --port
      - "7006"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /tmp/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - "127.0.0.1"
      - --appendonly
      - "no"
      - --save
      - ""

  clusterinit:
    image: redis:7-alpine
    network_mode: host
    depends_on:
      - redis1
      - redis2
      - redis3
      - redis4
      - redis5
      - redis6
    restart: "no"
    command:
      - sh
      - -c
      - |
        for p in 7001 7002 7003 7004 7005 7006; do
          until redis-cli -h 127.0.0.1 -p $$p ping >/dev/null 2>&1; do sleep 0.2; done
        done
        redis-cli --cluster create \
          127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 \
          127.0.0.1:7004 127.0.0.1:7005 127.0.0.1:7006 \
          --cluster-replicas 1 --cluster-yes
