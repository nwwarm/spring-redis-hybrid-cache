name: JMH benchmarks
on:
  pull_request:
    paths:
      - 'src/main/java/**'
      - 'cache-benchmarks/**'
      - '.github/workflows/benchmarks.yml'

# Non-blocking job: posts JMH results back to the PR as a comment but
# does not gate merge. The 1.0.0 trigger criteria (DESIGN.md §8) flip
# this to a blocking gate when the published baseline in §11 is
# locked in.
permissions:
  contents: read
  pull-requests: write

jobs:
  jmh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Install library snapshot
        run: mvn -B -DskipTests install
      - name: Build benchmarks
        run: mvn -B -f cache-benchmarks/pom.xml verify
      - name: Run benchmarks (short)
        # The full suite takes hours; CI runs a short sweep that catches
        # gross regressions. The full sweep runs on release/* branches
        # via release.yml (drafted but not yet wired — see DESIGN.md §11
        # / Deferred items).
        run: |
          java -jar cache-benchmarks/target/benchmarks.jar \
            -wi 2 -i 3 -f 1 -r 2 \
            -rf json -rff jmh-results.json
      - name: Post results to PR
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: jmh-results.json
