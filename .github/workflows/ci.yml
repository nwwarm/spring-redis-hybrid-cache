name: CI
on:
  pull_request:
  push:
    branches: [main, 'release/*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Verify
        run: mvn -B verify
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  property-tests:
    # Already part of `mvn verify` (jqwik annotations are picked up by Surefire/Failsafe);
    # the catalog mapping is in DESIGN.md §7. This job exists so a future jqwik regression
    # surfaces as a distinct red check rather than buried inside the wider verify run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Run property tests
        run: mvn -B test -Dtest='*Property*'

  mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: PIT mutation testing
        run: mvn -B test org.pitest:pitest-maven:mutationCoverage
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/
