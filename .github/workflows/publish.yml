name: Publish to Maven Central

# This tells GitHub to only run this action when you push a new tag starting with 'v'
# (e.g., when you create a GitHub Release named v0.1.1)
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          # The setup-java action magically creates the settings.xml for you!
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Publish to Maven Central
        # We pass the secrets as environment variables so setup-java can use them
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # The --no-transfer-progress flag just keeps the GitHub logs clean
        run: mvn --batch-mode --no-transfer-progress clean deploy -P release